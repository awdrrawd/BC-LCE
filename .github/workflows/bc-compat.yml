name: BC compatibility

# 每週檢查 LCE 掛鉤 / patch 的 Bondage Club 函式，是否仍與已記錄的基準一致。
# 有差異時開一個 issue，差異內容改變時更新並留言，差異消失後自動關閉；不會擋 PR，也不會擋部署。
# 步驟在共用 workflow awdrrawd/Bondage-College-Mirror/.github/workflows/reusable-bc-compat.yml：
# 抓鏡像的 bondageclub 分支，執行 `scripts/check-bc-compat.mjs --bc-dir <bc> --json --report <md>`，
# 再把結果交給 `scripts/bc-compat-issue.mjs`。
# 可用 repository variables BC_REPO_URL / BC_REF 改用其他來源，手動執行時也能指定分支或 tag。
on:
  schedule:
    - cron: '7 1 * * 1' # 週一 09:07 Asia/Taipei，避開整點排程擁擠
  workflow_dispatch:
    inputs:
      ref:
        description: 要檢查的 BC 分支或 tag（空白 = BC_REF 變數，否則用鏡像的 bondageclub 分支）
        required: false

permissions:
  contents: read

concurrency:
  group: bc-compat
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    uses: awdrrawd/Bondage-College-Mirror/.github/workflows/reusable-bc-compat.yml@main
    with:
      module: LCE
      bc-repo-url: ${{ vars.BC_REPO_URL }}
      bc-ref: ${{ inputs.ref || vars.BC_REF }}
      node-version: '22'
      check-script: scripts/check-bc-compat.mjs
      issue-script: scripts/bc-compat-issue.mjs
