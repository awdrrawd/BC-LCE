version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:07'
      timezone: Asia/Taipei
    # 新版本發布滿 7 天才提出更新 PR，避開被盜帳號發布、通常數小時到數天內就會被下架的惡意版本；安全性更新不受影響，仍會立即提出。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 小版本與修補版合併成一個 PR，大版本（例如 vite 8）仍各自獨立，方便個別檢查
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:07'
      timezone: Asia/Taipei
    # 新版本發布滿 7 天才提出更新 PR，避開被盜帳號發布、通常數小時到數天內就會被下架的惡意版本；安全性更新不受影響，仍會立即提出。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
